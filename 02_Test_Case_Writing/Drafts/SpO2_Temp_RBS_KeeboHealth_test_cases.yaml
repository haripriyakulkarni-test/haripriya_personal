  title: Completing a vital task timestamps the reading, moves it to completed, and Blood Sugar carries its reading-type tag

  metadata:
    module: Vitals as Patient Tasks
    feature: Task completion
    requirement_id: PRD-2.1
    priority: High
    severity: Critical
    type: Functional
    category: Positive
    automation_candidate: true
    tags: [tasks, completion, blood-sugar, reading-type]

  objective: >
    Verify marking a task complete timestamps the vital and moves the card to the completed
    section (PRD §2.1 AC2), and that for Blood Sugar the reading type taken is recorded
    against the value (PRD §2.1 AC4).

  preconditions:
    - Patient enrolled with SpO2 and Blood Sugar tasks enabled and pending.

  test_data:
