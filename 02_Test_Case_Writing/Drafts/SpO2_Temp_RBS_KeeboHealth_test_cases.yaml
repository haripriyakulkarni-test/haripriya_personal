test_case:
  id: KH-TASK-001
  title: SpO2, Temperature and Blood Sugar appear as patient tasks when enabled

  metadata:
    module: Vitals as Patient Tasks
    feature: Task visibility
    requirement_id: PRD-2.1
    priority: High
    severity: Critical
    type: Functional
    category: Positive
    automation_candidate: true
    tags: [tasks, spo2, temperature, blood-sugar, patient-app, smoke]

  objective: >
    Verify SpO2, Temperature and Blood Sugar each appear as a task on the Patient App task
    list when enabled for the patient, per PRD §2.1 AC1 and VP §6.1 Config/flag matrix
    ("Vital task enabled" row).

  preconditions:
    - Patient enrolled and authenticated in the Patient App.
    - All three vitals (SpO2, Temperature, Blood Sugar) enabled for this patient.

  test_data:
    patient_id: QA-PT-001
    vitals_enabled: [SpO2, Temperature, Blood Sugar]

  environment:
    application: KeeboHealth Patient Mobile App (tricare-mobile-flutter)
    build: Not specified (OI-1)
    environment: QA

  steps:
    - step: 1
      action: Log in as the patient and open the task list.
      expected_result: SpO2, Temperature and Blood Sugar each appear as a distinct pending task.
    - step: 2
      action: Inspect task ordering relative to any other pending tasks.
      expected_result: Pending tasks remain on top (no premature reordering).

  expected_result: >
    All three enabled vitals surface as pending tasks on the Patient App.

  postconditions:
    - No task state changed by this case (read-only check).

  validation:
    ui:
      - Task cards for SpO2, Temperature, Blood Sugar are visible and labeled correctly.
    api:
      - GET tasks endpoint returns all three vital tasks in pending state.
    database: []
    logs: []

  automation:
    framework: null
    script_location: null
    reusable_components: [PatientTaskListScreen]

  traceability:
    requirements: [PRD-2.1]
    vp_scenario: ["§6.1 Feature testing scope", "§6.1 Config/flag matrix — Vital task enabled"]
    risk: "Patient App Tasks & Manual Entry = HIGH (VP §3) — only capture path in scope, no device integration"
    defects: []

  execution:
    executed_by:
    execution_date:
    status:
    actual_result:
    evidence:
      screenshots: []
      videos: []
      logs: []

  remarks: Baseline positive case underpinning all downstream task/entry cases.

