test_case:
  id: KH-ENTRY-008
  title: Blood Sugar entry attempted with no reading type selected (gap-filler, OI-8)

  metadata:
    module: Manual Entry Flow
    feature: Reading-type selector
    requirement_id: PRD-2.2
    priority: Medium
    severity: Major
    type: Functional
    category: Negative
    automation_candidate: true
    tags: [manual-entry, blood-sugar, reading-type, ambiguity, gap-filler]

  objective: >
    Verify system behavior when a patient attempts to save a Blood Sugar reading without
    selecting a reading type. The PRD never states whether selection is mandatory (VP Open
    Issue OI-8) — this case closes the ambiguity for testing purposes (Save is blocked/prompts
    selection) and is flagged for Product confirmation before being treated as a hard pass/fail gate.

  preconditions:
    - Patient on the Blood Sugar manual entry form.
    - No reading type pre-selected / default-selected.

  test_data:
    value: "160 mg/dL"
    reading_type: null

  environment:
    application: KeeboHealth Patient Mobile App (tricare-mobile-flutter)
    build: Not specified (OI-1)
    environment: QA

  steps:
    - step: 1
      action: Enter 160 mg/dL, leave reading type unselected, and attempt Save.
      expected_result: >
        ACTUAL BEHAVIOR TO BE OBSERVED AND REPORTED — expected assumption for this case
        (pending Product confirmation) is that Save is blocked with a prompt to select a
        reading type, since AC4 implies the tag is required data against the value.

  expected_result: >
    System behavior for a missing reading-type selection is documented and compared against
    Product's eventual answer to OI-8; do not silently treat either outcome as correct.

  postconditions:
    - No record should be created without provenance for the reading-type field, pending Product's ruling.

  validation:
    ui:
      - Behavior on Save-without-selection is captured (blocked vs. saved with null/default).
    api:
      - Response/status for a save attempt with reading_type omitted is recorded.
    database:
      - Whether a row is created, and with what reading_type value, is recorded.
    logs: []

  automation:
    framework: null
    script_location: null
    reusable_components: [ManualEntryForm]

  traceability:
    requirements: [PRD-2.2]
    vp_scenario: ["§6.3 row 6 — Negative/Error-Guessing: Blood Sugar entry with no reading-type selected"]
    risk: "VP Open Issue OI-8 — ambiguity closed by QA for test design, flagged to Product"
    defects: []

  execution:
    executed_by:
    execution_date:
    status:
    actual_result:
    evidence:
      screenshots: []
      videos: []
      logs: []

  remarks: Do not close OI-8 based on this test's result alone — escalate observed behavior to Product for confirmation it's intentional.

