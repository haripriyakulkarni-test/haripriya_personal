    blood_sugar_value: "110 mg/dL"
    blood_sugar_reading_type: Fasting

  environment:
    application: KeeboHealth Patient Mobile App (tricare-mobile-flutter)
    build: Not specified (OI-1)
    environment: QA

  steps:
    - step: 1
