test_case:
  id: KH-ENTRY-004
  title: SpO2 manual entry — below-min, in-range, above-max values

  metadata:
    module: Manual Entry Flow
    feature: SpO2 range validation
    requirement_id: PRD-2.2
    priority: High
    severity: Critical
    type: Functional
    category: Edge
    automation_candidate: true
    tags: [manual-entry, spo2, boundary, equivalence-partitioning]

  objective: >
    Verify SpO2 manual entry accepts in-range values and rejects out-of-range values against
    the stated range 50-100% (PRD §2.2 AC1), with provenance always recorded (AC2).

  preconditions:
    - Patient on the SpO2 manual entry form.

  test_data:
    below_min: "45%"
    in_range: "97%"
    above_max: "105%"

  environment:
    application: KeeboHealth Patient Mobile App (tricare-mobile-flutter)
    build: Not specified (OI-1)
    environment: QA

  steps:
    - step: 1
      action: Enter 45% (below min) and attempt Save.
      expected_result: Inline validation error shown; no record created.
    - step: 2
      action: Enter 97% (in range) and Save.
      expected_result: Record created with timestamp, value=97%, unit=%, provenance=Manual.
    - step: 3
      action: Enter 105% (above max) and attempt Save.
      expected_result: Inline validation error shown; no record created.

  expected_result: >
    Range validation correctly partitions below-min/above-max as rejected and in-range as accepted;
    every successful save carries provenance=Manual.

  postconditions:
    - Exactly one new SpO2 record exists (the in-range save).

  validation:
    ui:
      - Inline error text shown for both invalid attempts; non-intrusive success confirmation for the valid one.
    api:
      - Save call for invalid values returns a validation error (4xx); valid value returns 200/201.
    database:
      - Saved row has provenance=Manual, correct timestamp and unit.
    logs: []

  automation:
    framework: null
    script_location: null
    reusable_components: [ManualEntryForm]

  traceability:
    requirements: [PRD-2.2]
    vp_scenario: ["§6.3 row 3 — Equivalence Partitioning: manual entry below-min/in-range/above-max"]
    risk: "Patient App Tasks & Manual Entry = HIGH (VP §3); Data Integrity NFR (VP §6.2)"
    defects: []

  execution:
    executed_by:
    execution_date:
    status:
    actual_result:
    evidence:
      screenshots: []
      videos: []
      logs: []

  remarks:

