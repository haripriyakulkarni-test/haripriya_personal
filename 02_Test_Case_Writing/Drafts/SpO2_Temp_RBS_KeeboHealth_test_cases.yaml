test_case:
  id: KH-ALERT-027
  title: Threshold breach with Smart Alerts engine NOT live shows the flag but no alert, without blocking other vitals features

  metadata:
    module: Alerts
    feature: Alert generation — degraded/conditional mode
    requirement_id: PRD-2.9
    priority: High
    severity: Critical
    type: Functional
    category: Edge
    automation_candidate: true
    tags: [alerts, smart-alerts, conditional, critical-edge-case]

  objective: >
    Verify that when the Smart Alerts engine is NOT live, an out-of-range reading still shows
    its flag badge, but generates NO alert, and that this does not block or degrade §2.1-2.8
    behavior — per PRD §2.9 AC4, the release's most important conditional-scoping rule.

  preconditions:
    - Smart Alerts engine confirmed NOT LIVE in this environment.
    - Patient with RBS threshold >180 mg/dL.

  test_data:
    rbs_value: "195 mg/dL"

  environment:
    application: KeeboHealth Doctor Web Portal + Backend
    build: Not specified (OI-1)
    environment: QA

  steps:
    - step: 1
      action: Submit an RBS reading of 195 mg/dL (breaches threshold) with the engine confirmed not live.
      expected_result: Summary card flag badge shows "high"; no alert is generated (no Doctor Panel alert entry, no email).
    - step: 2
      action: Verify Task, Manual Entry, Summary Card, and Trend Graph features (§2.1-2.8) for this patient still function normally.
      expected_result: All unaffected — this FR being disabled does not degrade or block any other in-scope feature.

  expected_result: >
    Alerting cleanly no-ops when the engine isn't live; every other feature in scope is fully functional.

  postconditions:
    - Reading recorded and flagged; zero alert records created.

  validation:
    ui:
      - Flag badge correct; no alert UI element present.
    api:
      - No alert-creation call/event fired.
    database:
      - Reading row flagged; zero rows in alerts table for this event.
    logs:
      - No alert-related errors; feature no-ops cleanly (not a silent failure elsewhere).

  automation:
    framework: null
    script_location: null
    reusable_components: [AlertsPanel, PatientSummaryScreen]

  traceability:
    requirements: [PRD-2.9]
    vp_scenario: ["§6.1 Outcome x State matrix — Reading breaches threshold, Smart Alerts NOT live", "PRD §2.9 AC4"]
    risk: "Doctor Web Portal Thresholds & Alerts = HIGH (VP §3) — this is the release's key conditional-scope gate"
    defects: []

  execution:
    executed_by:
    execution_date:
    status:
    actual_result:
    evidence:
      screenshots: []
      videos: []
      logs: []

  remarks: This is the highest-priority edge case in the Alerts module — a failure here means the whole release could be incorrectly gated on Smart Alerts readiness.

