  objective: >
    Verify the pre-existing "Add manually" speed path for BP, HR and Weight is unaffected by
    this release — visible during an active device timer, cancels the timer, and records the
    value identically to a normal manual entry (PRD §3.3 AC1-AC3).

  preconditions:
    - Patient has an active device-timed BP task.

  test_data:
    vital: BP
    value: "120/80 mmHg"

  environment:
    application: KeeboHealth Patient Mobile App (tricare-mobile-flutter)
    build: Not specified (OI-1)
    environment: QA

  steps:
    - step: 1
      action: Start the BP device timer, then tap "Add manually".
      expected_result: Timer is cancelled; manual entry form opens immediately.
    - step: 2
      action: Enter 120/80 mmHg and Save.
      expected_result: Value is recorded identically to a standard manual entry (provenance=Manual).

  expected_result: >
    Speed path continues to function exactly as before this release for BP/HR/Weight.

  postconditions:
    - One BP record created via the speed path.

  validation:
